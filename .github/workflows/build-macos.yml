name: Build macOS app
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Sample Atlas.app
        run: scripts/make-app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Sample-Atlas-macos
          path: dist/Sample-Atlas-macos.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Sample-Atlas-macos.zip --title "Sample Atlas $GITHUB_REF_NAME" --generate-notes
